name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Dummy values — the build only needs them to be present.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy

  rls-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply shim, migrations, and seeds
        run: |
          createdb calledit
          psql -d calledit -v ON_ERROR_STOP=1 -f scripts/supabase-shim.sql
          for f in supabase/migrations/*.sql; do
            psql -d calledit -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -d calledit -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: RLS smoke tests
        run: psql -d calledit -v ON_ERROR_STOP=1 -f scripts/rls-smoke.sql
